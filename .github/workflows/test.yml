name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 15 * * 1"   # Mondays — surface time-dependent failures even when nothing merges
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m py_compile lookup.py server.py scripts/qc_parcels.py
